<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" role="img" aria-labelledby="logoTitle" aria-describedby="logoDesc">
  <title id="logoTitle">BestGames — логотип интернет-магазина видеоигр</title>
  <desc id="logoDesc">Векторный логотип BestGames: название компании и стилизованный игровой контроллер</desc>
  <defs>
    <linearGradient id="gradLogo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Игровой контроллер (иконка слева) -->
  <g transform="translate(20, 10)" filter="url(#shadow)">
    <rect x="0" y="0" width="44" height="40" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <circle cx="16" cy="18" r="7" fill="#6366f1"/>
    <circle cx="28" cy="30" r="7" fill="#a855f7"/>
    <rect x="10" y="34" width="24" height="4" rx="2" fill="#64748b"/>
    <rect x="4" y="6" width="6" height="14" rx="2" fill="#94a3b8"/>
    <rect x="34" y="6" width="6" height="14" rx="2" fill="#94a3b8"/>
  </g>
  <!-- Название компании -->
  <text x="78" y="40" font-family="'Open Sans', 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="url(#gradLogo)" letter-spacing="-1">BestGames</text>
  <text x="78" y="56" font-family="'Open Sans', 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="2">ИНТЕРНЕТ-МАГАЗИН ВИДЕОИГР</text>
</svg>
